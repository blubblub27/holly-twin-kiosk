<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>寸甜甜 🦅 - 智能分身展台</title>
  <style>
    :root {
      --bg-wechat: #EDEDED;
      --bg-chat-canvas: #F3F3F3;
      --bubble-white: #FFFFFF;
      --bubble-green: #95EC69;
      --text-main: #181818;
      --border-color: #E3E3E3;
      --action-panel-bg: #F7F7F7;
      --system-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #121316;
      font-family: var(--system-font);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .kiosk-frame {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 920px;
      background-color: var(--bg-chat-canvas);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      overflow: hidden;
    }
    @media (max-width: 480px) {
      .kiosk-frame { max-width: 100%; height: 100%; max-height: 100vh; border-radius: 0; }
    }

    .nav-bar {
      height: 56px;
      background-color: var(--bg-wechat);
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
      flex-shrink: 0;
    }
    .nav-left { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .nav-back-icon {
      width: 12px; height: 12px;
      border-left: 2.2px solid #181818;
      border-bottom: 2.2px solid #181818;
      transform: rotate(45deg);
      margin-left: 2px;
    }
    .nav-back-badge { font-size: 14px; color: #181818; }
    .nav-center { text-align: center; flex: 1; padding: 0 8px; }
    .nav-title { font-size: 16px; font-weight: 600; color: #181818; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .nav-status { font-size: 11px; color: #7A7A7A; height: 14px; }
    .nav-status.typing { color: #07C160; font-weight: 500; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-btn { background: none; border: none; cursor: pointer; padding: 4px; color: #181818; }

    .prompt-pills-bar {
      background: rgba(237, 237, 237, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 0.5px solid var(--border-color);
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .prompt-pills-bar::-webkit-scrollbar { display: none; }
    .prompt-pill {
      background: #FFFFFF;
      border: 0.5px solid #D5D5D5;
      padding: 5px 11px;
      border-radius: 14px;
      font-size: 12px;
      color: #333;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .prompt-pill:active { background: #E5E5E5; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-divider { text-align: center; font-size: 11px; color: #B2B2B2; margin: 6px 0; }
    .chat-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 88%;
      animation: bubblePop 0.18s ease-out;
    }
    @keyframes bubblePop {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .chat-row.incoming { align-self: flex-start; }
    .chat-row.outgoing { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 38px; height: 38px; border-radius: 6px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .avatar.holly { background: linear-gradient(135deg, #FFE873, #FF9A8B); color: #4A2800; }
    .avatar.visitor { background: linear-gradient(135deg, #A8EDEA, #FED6E3); color: #333; }

    .bubble-wrapper { display: flex; flex-direction: column; }
    .chat-row.outgoing .bubble-wrapper { align-items: flex-end; }

    .bubble {
      position: relative;
      padding: 9px 12px;
      font-size: 14.5px;
      line-height: 1.45;
      border-radius: 6px;
      word-break: break-word;
    }
    .chat-row.incoming .bubble {
      background-color: var(--bubble-white);
      color: var(--text-main);
      border-top-left-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .chat-row.incoming .bubble::before {
      content: ""; position: absolute; top: 12px; left: -6px;
      border-top: 5px solid transparent; border-bottom: 5px solid transparent;
      border-right: 6px solid var(--bubble-white);
    }
    .chat-row.outgoing .bubble {
      background-color: var(--bubble-green);
      color: #050505;
      border-top-right-radius: 2px;
    }
    .chat-row.outgoing .bubble::before {
      content: ""; position: absolute; top: 12px; right: -6px;
      border-top: 5px solid transparent; border-bottom: 5px solid transparent;
      border-left: 6px solid var(--bubble-green);
    }

    .sticker-bubble { background: none !important; box-shadow: none !important; padding: 2px 4px !important; }
    .sticker-bubble::before { display: none !important; }
    .sticker-img {
      width: 128px; height: 128px; border-radius: 8px;
      object-fit: cover; display: block; background: #FFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .input-bar-container {
      background-color: #F7F7F7;
      border-top: 0.5px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
    }
    .input-bar { display: flex; align-items: center; padding: 7px 10px; gap: 8px; }
    .icon-action-btn {
      width: 32px; height: 32px; border: none; background: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #383838; flex-shrink: 0;
    }
    .icon-action-btn.active { color: #07C160; }

    .input-field-wrapper {
      flex: 1; background: #FFFFFF; border-radius: 6px;
      border: 0.5px solid #DCDCDC; padding: 7px 10px; min-height: 38px;
      display: flex; align-items: center;
    }
    .input-field {
      width: 100%; border: none; outline: none; font-size: 14.5px;
      font-family: inherit; resize: none; background: transparent; color: var(--text-main);
    }
    .send-btn {
      background-color: #07C160; color: #FFFFFF; border: none; border-radius: 4px;
      padding: 6px 12px; font-size: 14px; font-weight: 500; cursor: pointer; display: none;
    }

    .drawer-tray {
      display: none; background: var(--action-panel-bg);
      border-top: 0.5px solid #E6E6E6; padding: 12px 14px;
      max-height: 260px; overflow-y: auto;
    }
    .drawer-tray.open { display: block; }
    .sticker-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    }
    .sticker-grid-item {
      cursor: pointer; border-radius: 6px; overflow: hidden;
      aspect-ratio: 1/1; border: 0.5px solid #DDD; background: #FFF;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .sticker-grid-item:active { transform: scale(0.92); }
    .sticker-grid-item img { width: 100%; height: 100%; object-fit: cover; }

    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 100; display: none; align-items: flex-end; backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: #FFFFFF; width: 100%; border-radius: 18px 18px 0 0;
      padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid #EEE; padding-bottom: 8px; }
    .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #888; }
    .api-key-input { width: 100%; padding: 10px; border: 1px solid #CCC; border-radius: 6px; font-size: 13px; outline: none; margin-top: 6px; }
    .api-save-btn { background: #07C160; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 500; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>

    <header class="nav-bar">
      <div class="nav-left" id="resetBtn" title="重置给下一位观众">
        <div class="nav-back-icon"></div>
        <span class="nav-back-badge">微信</span>
      </div>
      <div class="nav-center">
        <div class="nav-title">
          <span>寸甜甜</span>
          <span>🦅</span>
        </div>
        <div class="nav-status" id="navStatus">在线</div>
      </div>
      <div class="nav-right">
        <button class="nav-btn" id="settingsBtn" title="配置 Gemini API Key">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
        <button class="nav-btn" id="fullscreenBtn" title="全屏展台">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m
